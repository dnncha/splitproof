name: mutation

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: mutate evaluate, assign and cert
        run: mutmut run --max-children 4
      - name: survivors
        id: survivors
        run: |
          mutmut results > survivors.txt || true
          cat survivors.txt
          echo "count=$(grep -c ': survived' survivors.txt || true)" >> "$GITHUB_OUTPUT"
      - name: report survivors to an issue
        if: steps.survivors.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Mutation testing: surviving mutants"
          {
            echo "${{ steps.survivors.outputs.count }} mutants survived on $(git rev-parse --short HEAD)."
            echo "Each one is a change to evaluate.py, assign.py or cert.py that no test noticed."
            echo
            echo '```'
            head -200 survivors.txt
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
