[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitproof"
version = "0.1.0"
description = "Build, audit and prove leakage-free train/test splits for biological data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
  "machine learning",
  "benchmark",
  "data leakage",
  "cross-validation",
  "bioinformatics",
  "computational biology",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "PyYAML>=6.0"]

[project.optional-dependencies]
chem = ["rdkit>=2023.3"]
parquet = ["pyarrow>=12.0"]
dev = ["pytest>=7.4", "hypothesis>=6.100", "ruff==0.8.6", "mypy==2.4.1", "types-PyYAML"]

[project.scripts]
splitproof = "splitproof.cli:main"

[project.urls]
Homepage = "https://github.com/dnncha/splitproof"
Issues = "https://github.com/dnncha/splitproof/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/splitproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B", "PLE", "PLW", "RUF012", "TID251"]
unfixable = ["B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.date.fromisoformat".msg = "accepts different formats on Python 3.10 and 3.11+; use splitproof.isodate.calendar_day"
"datetime.datetime.fromisoformat".msg = "accepts different formats on Python 3.10 and 3.11+; use splitproof.isodate.calendar_day"
